name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: PYTHONPATH=src:submission python -m unittest discover -s tests
      - run: python scripts/build_submission.py
      - run: python reference/starting_kit/tools/check_submission_zip.py dist/submission.zip
      - run: python reference/starting_kit/tools/run_smoke_test.py submission/

